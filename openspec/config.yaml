# OpenSpec config — Vaultine
# Auto-generated by sdd-init
# Date: 2026-06-07
# Mode: hybrid (openspec files + Engram)

project: Vaultine
version: "0.3.1-beta"

stack:
  language: C++17
  build_system: cmake
  min_cmake_version: "3.16"
  extensions: [.cc, .h]
  namespace: ssm::v1
  public_api: include/ssm/ssm.h
  source_dirs: [src, cli, tests, include]
  dependencies:
    - libsodium (crypto)
    - sqlcipher (database)
    - OpenSSL (AES-KW)
    - ncursesw (TUI)

testing:
  runner: GTest
  version: "1.15.2"
  test_command: ctest --test-dir build --output-on-failure
  direct_command: ./build/tests/ssm_test
  layers:
    unit:
      enabled: true
      targets:
        - crypto/random
        - crypto/argon2id
        - crypto/aes_kw
        - crypto/aes_gcm
        - db/database
        - db/migrations
        - db/users
        - db/kek_metadata
        - db/secrets
        - kek
        - utils/secure_memory
    integration:
      enabled: true
      targets:
        - lifecycle_test
        - backup_test
        - export_test
    fuzz:
      enabled: true
      compiler: clang
      cmake_flag: -DSSM_FUZZING=ON
      targets:
        - fuzz_api (SSM API)
        - fuzz_cli (hex parsing)
        - fuzz_password (password validation)
    benchmark:
      enabled: false
      cmake_flag: -DSSM_BUILD_BENCHMARKS=ON
      targets:
        - ssm_bench
  strict_tdd: true
  sanitizers: [ASan, UBSan]
  concurrency: std::thread (up to 10 threads)
  ci_timeout: 300
  valgrind: true (Debug builds)

lint:
  formatter: clang-format
  formatter_config: .clang-format (Google style, 100 cols, 4-space indent)
  formatter_command: >
    find src/ include/ tests/ cli/ -name '*.cc' -o -name '*.h' | xargs clang-format -i
  static_analysis: clang-tidy (work in progress)

conventions:
  error_pattern: do { ... } while(false) with break on first failure
  exceptions: false
  memory:
    allocation: secure_alloc (malloc + mlock)
    wiping: sodium_memzero via secure_erase()
  thread_safety:
    sqlite: SQLITE_OPEN_FULLMUTEX
    locking: std::shared_mutex with std::unique_lock in public API
  caching:
    type: LRU
    size: 256 KEK wrapping keys
    ttl: 90 days (KEK validity)
    atomic_rotation: true (ACID transaction with BEGIN IMMEDIATE)
  audit_log:
    fields: [operation, operation_target, details, result]
    coverage: all operations
  password_validation:
    default_min_length: 4
    configurable: true (via ssm_set_password_validator)
  symbol_visibility: SSM_EXPORT attribute, hidden default in Release
  codegraph: true (.codegraph/ index active)

persistence:
  mode: hybrid
  openspec_path: openspec/
  engram_keys:
    project: sdd-init/Vaultine
    testing: sdd/Vaultine/testing-capabilities
    registry: skill-registry
